{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Error</title>
    <link rel="stylesheet" type="text/css" href="{% static 'predictor/css/style.css' %}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        .error {
            background: #ffebee;
            padding: 20px;
            border-radius: 5px;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❌ Error</h1>
        <div class="error">
            <p>{{ message }}</p>
        </div>
        <p><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
